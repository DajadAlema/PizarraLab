<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' https://fonts.googleapis.com https://fonts.gstatic.com https://cdn.jsdelivr.net; script-src 'self' https://cdn.jsdelivr.net 'unsafe-inline'; style-src 'self' https://fonts.googleapis.com 'unsafe-inline';">
  <title>PizarraLab — Planner + Kanban</title>
  <link rel="manifest" href="/manifest.json"/>
  <link rel="icon" href="/icon-192.png" type="image/png"/>
  <link rel="apple-touch-icon" href="/icon-192.png"/>
  <meta name="theme-color" content="#0d0d0d"/>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/styles.css"/>
</head>
<body>

<!-- ── Auth Overlay ─────────────────────────────── -->
<div class="auth-overlay" id="authOverlay">
  <div class="auth-box">
    <div class="logo">Pizarra<span>Lab</span></div>

    <div id="loginForm">
      <h3 class="auth-title">Iniciar Sesión</h3>
      <form class="auth-form" onsubmit="handleLogin(event)">
        <input type="email" id="loginEmail" class="auth-input" placeholder="Tu email" required autocomplete="email"/>
        <input type="password" id="loginPassword" class="auth-input" placeholder="Tu contraseña" required autocomplete="current-password" minlength="6"/>
        <button type="submit" class="btn-auth">Entrar</button>
      </form>
      <div class="auth-switch">¿No tienes cuenta? <a onclick="toggleAuthForms()">Regístrate</a></div>
    </div>

    <div id="registerForm" style="display:none;">
      <h3 class="auth-title">Crear Cuenta</h3>
      <form class="auth-form" onsubmit="handleRegister(event)">
        <input type="email" id="registerEmail" class="auth-input" placeholder="Tu email" required autocomplete="email"/>
        <input type="password" id="registerPassword" class="auth-input" placeholder="Contraseña (mín. 6 caracteres)" required autocomplete="new-password" minlength="6"/>
        <button type="submit" class="btn-auth">Registrarse</button>
      </form>
      <div class="auth-switch">¿Ya tienes cuenta? <a onclick="toggleAuthForms()">Inicia sesión</a></div>
    </div>
  </div>
</div>

<!-- ── Header ───────────────────────────────────── -->
<header>
  <div class="logo">Pizarra<span>Lab</span></div>
  <div class="tabs">
    <button class="tab-btn active" onclick="switchView('weekly',this)">📅 Semanal</button>
    <button class="tab-btn" onclick="switchView('monthly',this)">🗓 Mensual</button>
    <button class="tab-btn" onclick="switchView('kanban',this)">🗂 Kanban</button>
  </div>
  <div class="header-actions">
    <button class="btn-sm" id="notifBtn" onclick="requestNotificationPermission()" title="Activar notificaciones">🔔</button>
    <button class="btn-sm" onclick="clearDone()">Limpiar hechas</button>
    <button class="btn-sm" onclick="exportData()">Exportar JSON</button>
    <button class="btn-sm btn-logout" onclick="handleLogout()">Salir</button>
  </div>
</header>

<!-- ── App Main ──────────────────────────────────── -->
<main id="appMain" style="display:none;">

  <!-- Add Task Bar -->
  <div class="add-bar">
    <input type="text" id="taskInput" placeholder="Nueva tarea…" maxlength="200" onkeydown="if(event.key==='Enter') addTask()"/>
    <input type="time" id="timeInput" title="Hora de la tarea (opcional)"/>
    <select id="tagSelect">
      <option value="work">💼 Trabajo</option>
      <option value="personal">🎯 Personal</option>
      <option value="urgent">🔥 Urgente</option>
      <option value="idea">💡 Idea</option>
    </select>
    <select id="statusSelect">
      <option value="todo">Por hacer</option>
      <option value="inprogress">En progreso</option>
      <option value="review">En revisión</option>
      <option value="done">Hecho</option>
    </select>
    <select id="daySelect"></select>
    <button class="btn-add" onclick="addTask()">+ Añadir</button>
  </div>

  <!-- Stats Bar -->
  <div class="stats-bar" id="statsBar"></div>

  <!-- Weekly View -->
  <div class="view active" id="view-weekly">
    <div class="period-nav">
      <button class="nav-btn" onclick="changeWeek(-1)">&#8249;</button>
      <span class="period-label" id="weekLabel"></span>
      <button class="nav-btn" onclick="changeWeek(1)">&#8250;</button>
      <button class="btn-sm" onclick="goToday()" style="margin-left:6px;">Hoy</button>
    </div>
    <div class="week-grid" id="weekGrid"></div>
  </div>

  <!-- Monthly View -->
  <div class="view" id="view-monthly">
    <div class="period-nav">
      <button class="nav-btn" onclick="changeMonth(-1)">&#8249;</button>
      <span class="period-label big" id="monthLabel"></span>
      <button class="nav-btn" onclick="changeMonth(1)">&#8250;</button>
      <button class="btn-sm" onclick="goTodayMonth()" style="margin-left:6px;">Hoy</button>
    </div>
    <div class="month-grid" id="monthGrid"></div>
  </div>

  <!-- Day Detail Modal -->
  <div class="modal-overlay" id="modalOverlay" onclick="closeModalBg(event)">
    <div class="modal">
      <div class="modal-header">
        <span class="modal-title" id="modalTitle"></span>
        <button class="modal-close" onclick="closeModalDirect()">&#10005;</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
      <div class="modal-add">
        <input type="text" id="modalInput" placeholder="Nueva tarea…" maxlength="200" onkeydown="if(event.key==='Enter') addTaskFromModal()"/>
        <input type="time" id="modalTimeInput" title="Hora (opcional)"/>
        <button class="btn-modal" onclick="addTaskFromModal()">+ Añadir</button>
      </div>
    </div>
  </div>

  <!-- Kanban View -->
  <div class="view" id="view-kanban">
    <div class="kanban-grid">
      <div class="kanban-col col-todo" ondragover="dragOver(event)" ondragleave="dragLeave(event)" ondrop="drop(event,'todo','kanban')">
        <div class="kanban-header"><span class="kanban-title">Por hacer</span><span class="kanban-count" id="cnt-todo">0</span></div>
        <div class="kanban-tasks" id="tasks-todo"></div>
      </div>
      <div class="kanban-col col-inprogress" ondragover="dragOver(event)" ondragleave="dragLeave(event)" ondrop="drop(event,'inprogress','kanban')">
        <div class="kanban-header"><span class="kanban-title">En progreso</span><span class="kanban-count" id="cnt-inprogress">0</span></div>
        <div class="kanban-tasks" id="tasks-inprogress"></div>
      </div>
      <div class="kanban-col col-review" ondragover="dragOver(event)" ondragleave="dragLeave(event)" ondrop="drop(event,'review','kanban')">
        <div class="kanban-header"><span class="kanban-title">En revisión</span><span class="kanban-count" id="cnt-review">0</span></div>
        <div class="kanban-tasks" id="tasks-review"></div>
      </div>
      <div class="kanban-col col-done" ondragover="dragOver(event)" ondragleave="dragLeave(event)" ondrop="drop(event,'done','kanban')">
        <div class="kanban-header"><span class="kanban-title">Hecho</span><span class="kanban-count" id="cnt-done">0</span></div>
        <div class="kanban-tasks" id="tasks-done"></div>
      </div>
    </div>
  </div>

</main>

<!-- ── Scripts ───────────────────────────────────── -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/app.js"></script>
</body>
</html>
