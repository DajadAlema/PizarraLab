<!DOCTYPE html>
<html lang="es">
<head>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net; connect-src 'self' https://oqfdstzfvgdxnzmsotim.supabase.co wss://oqfdstzfvgdxnzmsotim.supabase.co https://fonts.googleapis.com https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:;">
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PizarraLab — Planner + Kanban</title>
  <link rel="manifest" href="/manifest.json"/>
  <link rel="icon" href="/icon-192.png" type="image/png"/>
  <link rel="apple-touch-icon" href="/icon-192.png"/>
  <meta name="theme-color" content="#0d0d0d"/>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/styles.css"/>
</head>
<body>

<!-- ── Auth Overlay ─────────────────────────────── -->
<div class="auth-overlay" id="authOverlay">
  <div class="auth-box">
    <div class="logo">Pizarra<span>Lab</span></div>

    <div id="loginForm">
      <h3 class="auth-title">Iniciar Sesión</h3>
      <form class="auth-form" onsubmit="handleLogin(event)">
        <input type="text" id="loginIdentifier" class="auth-input" placeholder="Email o Nombre de usuario" required autocomplete="username"/>
        <input type="password" id="loginPassword" class="auth-input" placeholder="Tu contraseña" required autocomplete="current-password" minlength="6"/>
          <div class="password-toggle">
            <input type="checkbox" id="showPassLogin" onchange="togglePasswordVisibility('loginPassword')">
            <label for="showPassLogin">Mostrar contraseña</label>
          </div>
        <button type="submit" class="btn-auth">Entrar</button>
      </form>
      <div class="auth-switch">¿No tienes cuenta? <a onclick="toggleAuthForms()">Regístrate</a></div>
    </div>

    <div id="registerForm" style="display:none;">
      <h3 class="auth-title">Crear Cuenta</h3>
      <form class="auth-form" onsubmit="handleRegister(event)">
        <input type="text" id="registerUsername" class="auth-input" placeholder="Nombre de usuario (ej. ninja_99)" required pattern="^[a-zA-Z0-9_]{3,16}$" title="De 3 a 16 caracteres. Solo letras, números y guiones bajos (_). Sin espacios."/>
        
        <input type="email" id="registerEmail" class="auth-input" placeholder="Tu email" required autocomplete="email"/>
        <input type="password" id="registerPassword" class="auth-input" placeholder="Contraseña (mín. 6 caracteres)" required autocomplete="new-password" minlength="6"/>
          <div class="password-toggle">
            <input type="checkbox" id="showPassReg" onchange="togglePasswordVisibility('registerPassword')">
            <label for="showPassReg">Mostrar contraseña</label>
          </div>
        <button type="submit" class="btn-auth">Registrarse</button>
      </form>
      <div class="auth-switch">¿Ya tienes cuenta? <a onclick="toggleAuthForms()">Inicia sesión</a></div>
    </div>
  </div>
</div>

<!-- ── Header ───────────────────────────────────── -->
<header>
  <div class="logo">Pizarra<span>Lab</span></div>
  <div class="tabs">
    <button class="tab-btn active" onclick="switchView('weekly',this)">📅 Semanal</button>
    <button class="tab-btn" onclick="switchView('monthly',this)">🗓 Mensual</button>
    <button class="tab-btn" onclick="switchView('kanban',this)">🗂 Kanban</button>
  </div>
  <div class="header-actions">
    <button class="btn-sm" onclick="clearDone()">Limpiar hechas</button>
    
    <div class="user-badge" id="userBadge" style="display: none;" onclick="openSidebar()">
      <div class="user-avatar" id="userAvatar">?</div>
      <span class="user-name" id="userNameDisplay">@usuario</span>
    </div>
  </div>
</header>

<!-- ── App Main ──────────────────────────────────── -->
<main id="appMain" style="display:none;">

  <!-- Add Task Bar -->
  <div class="add-bar">
    <input type="text" id="taskInput" placeholder="Nueva tarea…" maxlength="200" onkeydown="if(event.key==='Enter') addTask()"/>
    <input type="time" id="timeInput" title="Hora de la tarea (opcional)"/>
    <select id="alertSelect" title="¿Cuándo avisar?">
      <option value="-1">Sin notificación</option>
      <option value="0">A la hora</option>
      <option value="15" selected>15 min antes</option>
      <option value="30">30 min antes</option>
      <option value="60">1 hora antes</option>
    </select>
    <select id="tagSelect">
      <option value="work">💼 Trabajo</option>
      <option value="personal">🎯 Personal</option>
      <option value="urgent">🔥 Urgente</option>
      <option value="idea">💡 Idea</option>
    </select>
    <select id="statusSelect">
      <option value="todo">Por hacer</option>
      <option value="inprogress">En progreso</option>
      <option value="review">En revisión</option>
      <option value="done">Hecho</option>
    </select>
    <select id="daySelect"></select>
    <button class="btn-add" onclick="addTask()">+ Añadir</button>
  </div>

  <!-- Stats Bar -->
  <div class="stats-bar" id="statsBar"></div>

  <!-- Weekly View -->
  <div class="view active" id="view-weekly">
    <div class="period-nav">
      <button class="nav-btn" onclick="changeWeek(-1)">&#8249;</button>
      <span class="period-label" id="weekLabel"></span>
      <button class="nav-btn" onclick="changeWeek(1)">&#8250;</button>
      <button class="btn-sm" onclick="goToday()" style="margin-left:6px;">Hoy</button>
    </div>
    <div class="week-grid" id="weekGrid"></div>
  </div>

  <!-- Monthly View -->
  <div class="view" id="view-monthly">
    <div class="period-nav">
      <button class="nav-btn" onclick="changeMonth(-1)">&#8249;</button>
      <span class="period-label big" id="monthLabel"></span>
      <button class="nav-btn" onclick="changeMonth(1)">&#8250;</button>
      <button class="btn-sm" onclick="goTodayMonth()" style="margin-left:6px;">Hoy</button>
    </div>
    <div class="month-grid" id="monthGrid"></div>
  </div>

  <!-- Day Detail Modal -->
  <div class="modal-overlay" id="modalOverlay" onclick="closeModalBg(event)">
    <div class="modal">
      <div class="modal-header">
        <span class="modal-title" id="modalTitle"></span>
        <button class="modal-close" onclick="closeModalDirect()">&#10005;</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
      <div class="modal-add">
        <input type="text" id="modalInput" placeholder="Nueva tarea…" maxlength="200" onkeydown="if(event.key==='Enter') addTaskFromModal()"/>
        <input type="time" id="modalTimeInput" title="Hora (opcional)"/>
        <select id="modalAlertSelect" title="¿Cuándo avisar?">
          <option value="-1">Sin notificación</option>
          <option value="0">A la hora</option>
          <option value="15" selected>15 min antes</option>
          <option value="30">30 min antes</option>
          <option value="60">1 hora antes</option>
        </select>
        <button class="btn-modal" onclick="addTaskFromModal()">+ Añadir</button>
      </div>
    </div>
  </div>

  <!-- Kanban View -->
  <div class="view" id="view-kanban">
    <div class="kanban-grid">
      <div class="kanban-col col-todo" ondragover="dragOver(event)" ondragleave="dragLeave(event)" ondrop="drop(event,'todo','kanban')">
        <div class="kanban-header"><span class="kanban-title">Por hacer</span><span class="kanban-count" id="cnt-todo">0</span></div>
        <div class="kanban-tasks" id="tasks-todo"></div>
      </div>
      <div class="kanban-col col-inprogress" ondragover="dragOver(event)" ondragleave="dragLeave(event)" ondrop="drop(event,'inprogress','kanban')">
        <div class="kanban-header"><span class="kanban-title">En progreso</span><span class="kanban-count" id="cnt-inprogress">0</span></div>
        <div class="kanban-tasks" id="tasks-inprogress"></div>
      </div>
      <div class="kanban-col col-review" ondragover="dragOver(event)" ondragleave="dragLeave(event)" ondrop="drop(event,'review','kanban')">
        <div class="kanban-header"><span class="kanban-title">En revisión</span><span class="kanban-count" id="cnt-review">0</span></div>
        <div class="kanban-tasks" id="tasks-review"></div>
      </div>
      <div class="kanban-col col-done" ondragover="dragOver(event)" ondragleave="dragLeave(event)" ondrop="drop(event,'done','kanban')">
        <div class="kanban-header"><span class="kanban-title">Hecho</span><span class="kanban-count" id="cnt-done">0</span></div>
        <div class="kanban-tasks" id="tasks-done"></div>
      </div>
    </div>
  </div>

  <!-- Pop-up window for editing 25/03/2026 avbx4ch2 -->
  <div class="modal-overlay" id="editModalOverlay" onclick="closeEditModalBg(event)">
    <div class="modal">
      <div class="modal-header">
        <span class="modal-title">Editar Tarea</span>
        <button class="modal-close" onclick="closeEditModal()">&#10005;</button>
      </div>
      <div class="modal-body" style="padding-top: 16px;">
        <input type="hidden" id="editTaskId" />
        <div class="auth-form">
          <input type="text" id="editText" class="auth-input" placeholder="Texto de la tarea" maxlength="200" />
          <div style="display: flex; gap: 10px;">
            <input type="time" id="editTime" class="auth-input" title="Hora" style="flex: 1;" />
            <input type="date" id="editDate" class="auth-input" title="Fecha" style="flex: 1;" />
          </div>
          <div style="display: flex; gap: 10px;">
            <select id="editTag" class="auth-input" style="flex: 1;">
              <option value="work">💼 Trabajo</option>
              <option value="personal">🎯 Personal</option>
              <option value="urgent">🔥 Urgente</option>
              <option value="idea">💡 Idea</option>
            </select>
            <select id="editStatus" class="auth-input" style="flex: 1;">
              <option value="todo">Por hacer</option>
              <option value="inprogress">En progreso</option>
              <option value="review">En revisión</option>
              <option value="done">Hecho</option>
            </select>
          </div>
          <select id="editAlert" class="auth-input">
            <option value="-1">Sin notificación</option>
            <option value="0">Avisar a la hora</option>
            <option value="15">Avisar 15 min antes</option>
            <option value="30">Avisar 30 min antes</option>
            <option value="60">Avisar 1 hora antes</option>
          </select>
          <button class="btn-auth" onclick="saveEditTask()">Guardar Cambios</button>
        </div>
      </div>
    </div>
  </div>



  <!-- Profile overlay -->
  <div class="modal-overlay" id="profileModalOverlay" onclick="closeProfileModalBg(event)">
    <div class="modal" style="width: 480px;">
      <div class="modal-header">
        <span class="modal-title">Ajustes de Cuenta</span>
        <button class="modal-close" onclick="closeProfileModal()">&#10005;</button>
      </div>
      <div class="modal-body" style="padding: 20px; display: flex; flex-direction: column; gap: 20px;">
        
        <div>
          <label class="stat-label" style="display: block; margin-bottom: 10px; font-size: 0.85rem; color: var(--accent);">Perfil Público</label>
          <div style="display: flex; gap: 16px; align-items: center;">
            <div class="user-avatar" id="profileAvatarBig" style="width: 64px; height: 64px; font-size: 2rem;">?</div>
            <div style="flex: 1;">
              <label class="stat-label">Nombre de usuario</label>
              <input type="text" id="profileUsername" class="auth-input" style="width: 100%; margin-top: 4px;" pattern="^[a-zA-Z0-9_]{3,16}$"/>
            </div>
          </div>
          <div style="margin-top: 10px;">
            <label class="stat-label">Biografía</label>
            <input type="text" id="profileBio" class="auth-input" style="width: 100%; margin-top: 4px;" placeholder="Ej. Desarrollador Web, Estudiante..."/>
          </div>
        </div>

        <div class="stat-divider" style="width: 100%; height: 1px;"></div>

        <div>
          <label class="stat-label" style="display: block; margin-bottom: 10px; font-size: 0.85rem; color: var(--accent);">Preferencias</label>
          <div style="display: flex; gap: 10px; flex-wrap: wrap;">
            <div style="flex: 1; min-width: 180px;">
              <label class="stat-label">Tema Visual</label>
              <select id="profileTheme" class="auth-input" style="width: 100%; margin-top: 4px;">
                <option value="legacy">Oscuro (Original)</option>
                <option value="soft">Noche Suave</option>
                <option value="sakura">Sakura 🌸</option>
              </select>
            </div>
            <div style="flex: 1; min-width: 180px;">
              <label class="stat-label">Alerta por defecto</label>
              <select id="profileDefaultAlert" class="auth-input" style="width: 100%; margin-top: 4px;">
                <option value="-1">Sin notificación</option>
                <option value="0">A la hora</option>
                <option value="15">15 min antes</option>
                <option value="30">30 min antes</option>
                <option value="60">1 hora antes</option>
              </select>
            </div>
          </div>
        </div>

        <div class="stat-divider" style="width: 100%; height: 1px;"></div>

        <div>
           <label class="stat-label" style="display: block; margin-bottom: 10px; font-size: 0.85rem; color: var(--accent);">Seguridad</label>
           <div style="margin-bottom: 10px;">
              <label class="stat-label">Correo Electrónico (Solo lectura por seguridad)</label>
              <input type="email" id="profileEmail" class="auth-input" style="width: 100%; margin-top: 4px; opacity: 0.6; cursor: not-allowed;" disabled/>
           </div>
           <div>
              <label class="stat-label">Nueva Contraseña (Opcional)</label>
              <input type="password" id="profileNewPassword" class="auth-input" style="width: 100%; margin-top: 4px;" placeholder="Dejar en blanco para no cambiar" minlength="6"/>
           </div>
        </div>

        <div class="stat-divider" style="width: 100%; height: 1px;"></div>

        <div style="display: flex; justify-content: space-between; align-items: center;">
          <div style="font-size: 0.75rem; color: var(--muted); font-family: var(--font-mono);" id="profileStats">
            Miembro desde: ... <br> Tareas hechas: ...
          </div>
          <button class="btn-auth" id="saveProfileBtn" onclick="saveProfile()" style="width: auto; padding: 10px 24px;">Guardar Cambios</button>
        </div>

      </div>
    </div>
  </div>
  
</main>

    <!-- Barra lateral -->
<div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebarBg(event)">
    <div class="sidebar" id="sidebar">
      
      <div class="sidebar-header">
        <div class="sidebar-user-info">
          <div class="user-avatar big-avatar" id="sidebarAvatar">?</div>
          <div class="user-details">
            <span class="user-name" id="sidebarUsername">@usuario</span>
            <span class="user-email" id="sidebarEmail">correo@ejemplo.com</span>
          </div>
        </div>
        <button class="sidebar-close" onclick="closeSidebar()">&#10005;</button>
      </div>
      
      <div class="sidebar-menu">
        <div class="menu-label">Herramientas Rápidas</div>
        <button class="menu-item" id="notifBtn" onclick="toggleNotifications()">🔔 Notificaciones</button>
        <button class="menu-item" onclick="exportICS()">📅 Sincronizar Calendario</button>
        <button class="menu-item" onclick="exportData()">💾 Exportar JSON</button>
      </div>

      <div class="sidebar-footer">
        <button class="btn-sm btn-settings" onclick="openProfileModalFromSidebar()">⚙️ Ajustes de Cuenta</button>
        <button class="btn-sm btn-logout" onclick="handleLogout()" style="width: 100%;">🚪 Salir</button>
      </div>
      
    </div>
  </div>

<!-- ── Scripts ───────────────────────────────────── -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/app.js"></script>
</body>
</html>
